# Один инстанс Tempo с локальным хранилищем. Принимает OTLP с 4318 (http)
# и 4317 (grpc) — туда сервис и сливает спаны.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # В стенде блоки собираются быстро: иначе трейсы появляются в Tempo
  # получасами, и демонстрация превращается в ожидание.
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 24h

# Генератор span-метрик: по трейсам Tempo считает RED-метрики и граф
# сервисов, и отдаёт их в Prometheus через remote write. Из-за этого
# в Grafana работают «traces to metrics» и карта сервисов.
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: devops-lab
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
