# Один инстанс Tempo (монолитный режим) с локальным хранилищем.
# Принимает OTLP с 4318 (http) и 4317 (grpc) — туда сервис сливает спаны.
#
# В Tempo 3.x сборка блоков и уплотнение уехали в микросервисный режим,
# поэтому блоков ingester/compactor здесь нет, а live-store сам
# раздаёт свежие трейсы на запросы.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

# Генератор span-метрик: по трейсам считает RED-метрики и граф сервисов,
# затем отдаёт их в Prometheus через remote write. Из-за этого в Grafana
# работают «traces to metrics» и карта сервисов.
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: devops-lab
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Процессоры по умолчанию выключены, их включают именно в overrides
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
