global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    lab: devops-lab

rule_files:
  - rules.yml

scrape_configs:
  # Сервис-стенд в docker-compose или в кластере
  - job_name: devops-lab
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8080
        labels:
          env: lab

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
