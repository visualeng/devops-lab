---
- name: Положить ключ репозитория docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Подключить репозиторий docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Установить docker с плагином compose
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ограничить размер логов docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "10m", "max-file": "3"}
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Держать docker включённым
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Добавить пользователя деплоя в группу docker
  ansible.builtin.user:
    name: "{{ docker_deploy_user }}"
    groups: docker
    append: true
