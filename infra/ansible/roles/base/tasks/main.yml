---
- name: Обновить кэш пакетов
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Поставить базовые утилиты
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fail2ban
      - git
      - unattended-upgrades
    state: present

- name: Включить автоматические обновления безопасности
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Создать пользователя для деплоя
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    state: present

- name: Положить ssh-ключ пользователю деплоя
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_public_key }}"
    state: present

- name: Разрешить пользователю деплоя sudo без пароля
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo --check --file=%s

- name: Создать каталог приложения
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Создать каталог состояния деплоя
  ansible.builtin.file:
    path: "{{ app_dir }}/state"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
