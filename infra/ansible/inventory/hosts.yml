---
# Адрес и пользователь берутся из переменных окружения: один и тот же
# инвентарь работает и за рабочим столом, и в CI.
#   DEPLOY_HOST=203.0.113.10 ansible-playbook playbooks/provision.yml
all:
  children:
    staging:
      hosts:
        devops-lab:
          ansible_host: "{{ lookup('ansible.builtin.env', 'DEPLOY_HOST') | default('127.0.0.1', true) }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'DEPLOY_USER') | default('root', true) }}"
