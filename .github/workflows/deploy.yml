# Ручной деплой на сервер. Запускается только вручную и только через
# окружение production: там лежат секреты и правило подтверждения.
#
# Сервер предполагается подготовленным инфраструктурой из репозитория:
# bare-клон этого репозитория в /opt/devops-lab и установленный docker.
name: deploy

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Образ: ghcr.io/visualeng/devops-lab:<тег или коммит>"
        required: true
        default: ghcr.io/visualeng/devops-lab:main
      smoke_url:
        description: "Адрес стенда для дымовой проверки после деплоя"
        required: true
        default: http://127.0.0.1:8080

# Два деплоя одновременно не идут: второй дождётся, а не отменит первый.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: логин в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: подготовить ssh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::warning::секреты деплоя не заданы, стенд пропущен и образ не тронут"
            echo "DEPLOY_ENABLED=false" >>"$GITHUB_ENV"
            exit 0
          fi
          install -m 700 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KEY}" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "DEPLOY_ENABLED=true" >>"$GITHUB_ENV"

      # Тег превращаем в digest: задеплоить нужно ровно то, что подписано
      # и просканировано, а не «что сейчас по этому тегу».
      - name: превратить тег в digest
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          docker pull "${{ inputs.image }}"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${{ inputs.image }}")"
          echo "IMAGE_REF=${ref}" >>"$GITHUB_ENV"
          echo "resolved: ${ref}"

      - name: деплой на сервер
        if: env.DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/devops-lab && ./deploy/deploy.sh '${IMAGE_REF}'"

      - name: дымовая проверка
        if: env.DEPLOY_ENABLED == 'true'
        env:
          BASE_URL: ${{ inputs.smoke_url }}
        run: ./scripts/smoke.sh

      - name: откат на предыдущий образ
        if: failure() && env.DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/devops-lab && IMAGE_REPO='${IMAGE_REPO}' ./deploy/rollback.sh"
