# Проверка инфраструктурного кода: terraform и ansible прогоняются в CI,
# чтобы опечатка в конфигурации не ждала ручного деплоя.
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: форматирование
        run: terraform fmt -check -recursive

      - name: инициализация без бэкенда
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

  ansible:
    name: ansible lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/ansible/requirements.txt

      - name: зависимости
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: синтаксис playbooks
        run: ansible-playbook --syntax-check playbooks/provision.yml playbooks/deploy.yml

      - name: ansible-lint
        run: ansible-lint
