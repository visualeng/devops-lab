# Проверка инфраструктурного кода: terraform и ansible прогоняются в CI,
# чтобы опечатка в конфигурации не ждала ручного деплоя.
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: форматирование
        run: terraform fmt -check -recursive

      - name: инициализация без бэкенда
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

  ansible:
    name: ansible lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/ansible/requirements.txt

      - name: зависимости
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: синтаксис playbooks
        run: ansible-playbook --syntax-check playbooks/provision.yml playbooks/deploy.yml

      - name: ansible-lint
        run: ansible-lint

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k8s/charts/devops-lab
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5.0.1

      - name: helm lint
        run: helm lint .

      # Рендерим с включёнными необязательными блоками: по умолчанию они
      # выключены, и ошибка в них иначе всплыла бы только на проде.
      - name: helm template со всеми опциями
        run: |
          helm template staging . \
            --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set autoscaling.enabled=true

  prometheus:
    name: prometheus config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # promtool живёт внутри официального образа: тянуть его отдельно
      # на раннер не нужно. Entrypoint образа — сам prometheus, поэтому
      # переопределяем его на promtool.
      - name: конфиг и правила
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml

  loki:
    name: loki config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: конфиг Loki
        run: |
          docker run --rm --entrypoint /usr/bin/loki \
            -v "$PWD/observability/loki:/etc/loki:ro" \
            grafana/loki:v3.7.8 -config.file=/etc/loki/loki-config.yaml -verify-config=true

  tempo:
    name: tempo config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: конфиг Tempo
        run: |
          docker run --rm --entrypoint /tempo \
            -v "$PWD/observability/tempo:/etc/tempo:ro" \
            grafana/tempo:v3.0.3 -config.file=/etc/tempo/tempo.yaml -config.verify

  alloy:
    name: alloy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: конфиг Alloy
        run: |
          docker run --rm --entrypoint /bin/alloy \
            -v "$PWD/observability/alloy:/etc/alloy:ro" \
            grafana/alloy:v1.20.0 validate /etc/alloy/config.alloy
