{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devops-lab.fullname" . }}
  labels:
    {{- include "devops-lab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devops-lab.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Только ingress-контроллер и Prometheus: наружу из кластера
    # к сервису больше никто не ходит.
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
