{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devops-lab.serviceAccountName" . }}
  labels:
    {{- include "devops-lab.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Прав на API кластера у сервиса нет: тянет образ и отвечает на /metrics.
automountServiceAccountToken: false
{{- end }}
